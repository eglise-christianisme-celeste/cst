# Analyse SonarQube du job Jenkins cst (ecc-devops) : projet, jeton et attente de la Quality Gate sont imposés par le
# pipeline. Couverture : tests Django du backend (backend/coverage.xml). Le frontend et le JavaScript du back-office
# n'ont pas encore de tests : ils sont analysés, sans mesure de couverture.
sonar.projectKey=cst
sonar.projectName=CST / CSMO
sonar.sourceEncoding=UTF-8
sonar.sources=backend/apps,backend/config,frontend/app,frontend/components,frontend/lib,frontend/styles
sonar.tests=backend/apps
sonar.test.inclusions=**/tests/**
sonar.exclusions=**/migrations/**,**/__pycache__/**,**/node_modules/**,**/.next/**
sonar.coverage.exclusions=frontend/**,backend/apps/**/static/**
sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml
